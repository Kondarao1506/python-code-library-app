
services:
  db:
    image: kondarao/library:db
    ports:
      - "3306:3306"
    deploy:
      replicas: 2
    networks:
      - library
    volumes:
      - mydata:/var/lib/mysql

  auth_service:
    image: kondarao/library:authimg
    deploy:
      replicas: 2
    ports:
      - "5001:5001"
    networks:
      - library
    depends_on:
      - db

  book_service:
    image: kondarao/library:bookimg
    deploy:
      replicas: 2
    ports:
      - "5002:5002"
    networks:
      - library
    depends_on:
      - db

  borrow_service:
    image: kondarao/library:borrowimg
    deploy:
      replicas: 2
    ports:
      - "5003:5003"
    networks:
      - library
    depends_on:
      - db

  frontend:
    image: kondarao/library:appimg
    deploy:
      replicas: 2
    ports:
      - "5000:5000"
    networks:
      - library
    depends_on:
      - auth_service
      - book_service
      - borrow_service

volumes:
  mydata:

networks:
  library:
    driver: overlay
    attachable: true
